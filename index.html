<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLT Linjekarta</title>
    
    <!-- 1. Leaflet CSS och JavaScript via CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        /* Gör så att kartan tar upp hela skärmen */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- 2. Behållaren där kartan kommer att ritas ut -->
    <div id="map"></div>

    <script>
        // 3. Initiera kartan och centrera över Jönköpings län
        const map = L.map('map').setView([57.5, 14.2], 9);

        // 4. Lägg till bakgrundskarta (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap bidragsgivare'
        }).addTo(map);

        // 5. Sökvägen till din GeoJSON-fil (Ändra URL:en nedan!)
        const geojsonUrl = 'https://raw.githubusercontent.com/henrikberglind/jlt-map-data/d0ac206f3fdca9e357f6520301081b079e0988e4/final_output/jlt.geojson';

        // 6. Hämta och rita ut GeoJSON-datan
        fetch(geojsonUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Kunde inte ladda GeoJSON-filen: ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                // Lägg till GeoJSON-lagret på kartan med lite snygg styling
                L.geoJSON(data, {
                    style: function (feature) {
                        return {
                            color: '#0054a6', // JLT-blå färg (eller valfri färg)
                            weight: 3,        // Tjocklek på linjerna
                            opacity: 0.8
                        };
                    },
                    onEachFeature: function (feature, layer) {
                        // Om din GTFS-data innehåller rutt-namn (t.ex. route_short_name) visas det vid klick
                        if (feature.properties && feature.properties.route_short_name) {
                            layer.bindPopup('<b>Linje:</b> ' + feature.properties.route_short_name);
                        }
                    }
                }).addTo(map);
            })
            .catch(error => {
                console.error('Det uppstod ett fel:', error);
                alert('Kunde inte ladda kartdata. Kontrollera URL:en i koden.');
            });
    </script>
</body>
</html>

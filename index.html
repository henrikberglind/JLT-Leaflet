<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jönköpings Länstrafik - Linjekarta</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            height: 100vh;
            width: 100vw;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com"></script>
    
    <script>
        // 1. Initiera kartan och centrera den över Jönköpings län
        const map = L.map('map').setView([57.50, 14.15], 9);

        // 2. Lägg till en snygg och neutral bakgrundskarta (CartoDB Positron)
        // Detta gör att busslinjerna syns tydligt utan att kartan blir för rörig
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors © <a href="https://carto.com">CARTO</a>'
        }).addTo(map);

        // 3. Ange URL:en till din råa GeoJSON-fil på GitHub
        // BYT UT: "DITT_ANVÄNDARNAMN", "DITT_REPO" och "EXAKT_FILNAMN.geojson" mot dina egna uppgifter!
        const geojsonUrl = 'https://githubusercontent.com';

        // 4. Hämta datan och lägg till den på kartan
        fetch(geojsonUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Kunde inte hämta GeoJSON-filen från GitHub.');
                }
                return response.json();
            })
            .then(geojsonData => {
                L.geoJSON(geojsonData, {
                    // Sätt design och färg på linjerna
                    style: function (feature) {
                        // Hämta färg från GTFS-filen (t.ex. "FF0000"), annars använd standardblå (#0074D9)
                        const routeColor = feature.properties.route_color 
                            ? '#' + feature.properties.route_color 
                            : '#0074D9';
                        
                        return {
                            color: routeColor,
                            weight: 3,         // Tjocklek på linjen
                            opacity: 0.75,     // Genomskinlighet
                            lineJoin: 'round'  // Mjuka kurvor i svängar
                        };
                    },
                    // Lägg till en klickbar popup för varje linje
                    onEachFeature: function (feature, layer) {
                        if (feature.properties) {
                            const lineName = feature.properties.route_short_name || 'Okänt nummer';
                            const lineDesc = feature.properties.route_long_name || '';
                            
                            layer.bindPopup(`
                                <div style="font-size: 14px;">
                                    <b>Linje ${lineName}</b><br>
                                    <span style="color: #555;">${lineDesc}</span>
                                </div>
                            `);
                            
                            // Highlighta linjen kort när muspekaren hovrar över den
                            layer.on({
                                mouseover: function (e) {
                                    const l = e.target;
                                    l.setStyle({ weight: 5, opacity: 1 });
                                },
                                mouseout: function (e) {
                                    layer.setStyle({ weight: 3, opacity: 0.75 });
                                }
                            });
                        }
                    }
                }).addTo(map);
            })
            .catch(error => {
                console.error('Ett fel uppstod vid laddning av kartan:', error);
                alert('Kartan kunde inte laddas. Kontrollera URL:en till din GeoJSON-fil.');
            });
    </script>
</body>
</html>
